plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

Properties localProps = new Properties()
File localPropsFile = project.rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(localPropsFile.newDataInputStream())
}

String supabaseUrl = localProps.getProperty('SUPABASE_URL',
        localProps.getProperty('supabase.url', ''))
String supabaseAnonKey = localProps.getProperty('SUPABASE_ANON_KEY',
        localProps.getProperty('supabase.anon_key', ''))

// Optional trusted endpoint that grants the Firebase custom claim Supabase needs.
// Empty means "not configured": the app then reports the missing claim instead of
// pretending the write can succeed. No credential of any kind lives here — the
// endpoint is called with the user's own Firebase ID token.
String claimProvisionUrl = localProps.getProperty('CLAIM_PROVISION_URL', '')
if (claimProvisionUrl == null) claimProvisionUrl = ''
claimProvisionUrl = claimProvisionUrl.trim()

if (supabaseUrl == null) supabaseUrl = ''
if (supabaseAnonKey == null) supabaseAnonKey = ''
supabaseUrl = supabaseUrl.trim()
if (!supabaseUrl.isEmpty() && !supabaseUrl.endsWith('/')) {
    supabaseUrl = supabaseUrl + '/'
}

android {
    namespace 'com.insta.nova'
    compileSdk 34

    defaultConfig {
        // Single package identity across applicationId, namespace and Java packages.
        applicationId "com.insta.nova"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${supabaseAnonKey}\""
        buildConfigField "String", "BASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "API_BASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "CLAIM_PROVISION_URL", "\"${claimProvisionUrl}\""
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        // Make android.util.Log return default values (instead of throwing) so
        // unit tests can exercise callbacks that go through Log without
        // requiring Robolectric.
        unitTests.returnDefaultValues = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'

    // Auth wizard: PickVisualMedia / TakePicture contracts + lifecycle
    implementation 'androidx.activity:activity:1.8.2'

    // Live (simulated): CameraX preview only — no recording, no networking.
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'
    // Avatar / profile-picture cropping (1:1), resolved from jitpack.io
    implementation 'com.github.yalantis:ucrop:2.2.8'

    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'

    // Firebase Authentication (versions aligned by the BOM)
    // Encrypted store for PAGE 16 saved accounts
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-messaging'

    // WebRTC Android (Maintained binary on Maven Central)
    implementation 'io.getstream:stream-webrtc-android:1.2.2'

    testImplementation 'junit:junit:4.13.2'
    // InstantTaskExecutorRule: lets LiveData.postValue run synchronously in unit tests.
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
}

