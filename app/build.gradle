plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.google.firebase.firebase-perf'
}

Properties localProps = new Properties()
File localPropsFile = project.rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(localPropsFile.newDataInputStream())
}

String supabaseUrl = localProps.getProperty('SUPABASE_URL',
        localProps.getProperty('supabase.url', ''))
String supabaseAnonKey = localProps.getProperty('SUPABASE_ANON_KEY',
        localProps.getProperty('supabase.anon_key', ''))

// Optional trusted endpoint that grants the Firebase custom claim Supabase needs.
// Empty means "not configured": the app then reports the missing claim instead of
// pretending the write can succeed. No credential of any kind lives here — the
// endpoint is called with the user's own Firebase ID token.
String claimProvisionUrl = localProps.getProperty('CLAIM_PROVISION_URL', '')
if (claimProvisionUrl == null) claimProvisionUrl = ''
claimProvisionUrl = claimProvisionUrl.trim()

if (supabaseUrl == null) supabaseUrl = ''
if (supabaseAnonKey == null) supabaseAnonKey = ''
supabaseUrl = supabaseUrl.trim()
if (!supabaseUrl.isEmpty() && !supabaseUrl.endsWith('/')) {
    supabaseUrl = supabaseUrl + '/'
}

// Native OTA updates — the manifest published as a GitHub Release asset.
// "releases/latest/download/<asset>" always resolves to the newest non-prerelease
// release, so the URL never changes from one version to the next. Override it in
// local.properties only when testing against a fork.
// A build can also override it with -PupdateManifestUrl=... (used by the local
// update-flow test harness).
String updateManifestUrl = project.findProperty('updateManifestUrl') ?: ''
if (updateManifestUrl == null) updateManifestUrl = ''
if (updateManifestUrl.trim().isEmpty()) {
    updateManifestUrl = localProps.getProperty('UPDATE_MANIFEST_URL',
            localProps.getProperty('update.manifest_url', ''))
}
if (updateManifestUrl == null) updateManifestUrl = ''
updateManifestUrl = updateManifestUrl.trim()
if (updateManifestUrl.isEmpty()) {
    updateManifestUrl = 'https://github.com/mohammadhabib69/InstaNova/releases/latest/download/latest.json'
}

// Optional release signing. The OTA flow only works while every release is signed with
// the same key, because the platform installer refuses an update whose signature differs
// from the installed app. Kept out of the repository: values come from local.properties.
String releaseStoreFile = localProps.getProperty('RELEASE_STORE_FILE', '')
String releaseStorePassword = localProps.getProperty('RELEASE_STORE_PASSWORD', '')
String releaseKeyAlias = localProps.getProperty('RELEASE_KEY_ALIAS', '')
String releaseKeyPassword = localProps.getProperty('RELEASE_KEY_PASSWORD', '')
if (releaseStoreFile == null) releaseStoreFile = ''
boolean hasReleaseSigning = !releaseStoreFile.trim().isEmpty()

android {
    namespace 'com.insta.nova'
    compileSdk 34

    defaultConfig {
        // Single package identity across applicationId, namespace and Java packages.
        applicationId "com.insta.nova"
        minSdk 24
        targetSdk 34
        // Bump BOTH for every OTA release. versionCode is what Android and the in-app
        // updater compare; versionName is what the update dialog shows. The release
        // script (tools/ota/release.sh) reads these values and embeds them in latest.json.
        // The -PappVersionCode / -PappVersionName overrides exist so the OTA test harness
        // can build an "old" and a "new" APK without editing this file.
        versionCode((project.findProperty('appVersionCode') ?: 2) as int)
        versionName(project.findProperty('appVersionName') ?: "1.1.0")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Opt-in single-ABI build for devices where the installer refuses the universal
        // APK for lack of allocatable space (vivo reserves most of /data). Default builds
        // are untouched: pass -Parm64Only to strip the other native ABIs.
        if (project.hasProperty("arm64Only")) {
            ndk { abiFilters "arm64-v8a" }
        }

        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${supabaseAnonKey}\""
        buildConfigField "String", "BASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "API_BASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "CLAIM_PROVISION_URL", "\"${claimProvisionUrl}\""
        // Phase 1 shadow-write: mirrors the Supabase profile into Firestore when true.
        //
        // ON since 2026-10-30. A device session proved the gap was real: the throwaway account
        // (Firebase uid NwGz…, Supabase profile mrtest001) had NO users/{uid} and no
        // publicProfiles/{uid} document, so every Firestore read for a new account came back
        // empty. The target rule is "profiles live in Firestore", so the document has to exist
        // from the first session, not from a later bulk copy.
        buildConfigField "boolean", "FIREBASE_MIRROR", "true"

        // Where the native updater reads the latest release from. Empty is not a valid
        // state: without it the checker logs "not configured" and stays silent.
        buildConfigField "String", "UPDATE_MANIFEST_URL", "\"${updateManifestUrl}\""
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile.trim())
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    testOptions {
        // Make android.util.Log return default values (instead of throwing) so
        // unit tests can exercise callbacks that go through Log without
        // requiring Robolectric.
        unitTests.returnDefaultValues = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'

    // Auth wizard: PickVisualMedia / TakePicture contracts + lifecycle
    implementation 'androidx.activity:activity:1.8.2'

    // Live (simulated): CameraX preview only — no recording, no networking.
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'
    // Story camera records clips through CameraX Recorder (60 s cap, audio included).
    implementation 'androidx.camera:camera-video:1.3.1'
    // Avatar / profile-picture cropping (1:1), resolved from jitpack.io
    implementation 'com.github.yalantis:ucrop:2.2.8'

    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'

    // NOVA — local persistence (network meter, offline feed, post queue) + background work
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.work:work-runtime:2.9.0'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    // Lets the Nova byte meter observe image traffic through the shared OkHttp client.
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'

    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'

    // Firebase Authentication (versions aligned by the BOM)
    // Encrypted store for PAGE 16 saved accounts
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-messaging'
    // Phase 0/2: data plane + observability (each has an implementation, not just a dep)
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-perf'
    // P0-10: App Check. The provider is variant-specific — see AppCheckInstaller in the
    // debug/ and release/ source sets — so the debug provider class never ships in a
    // release APK.
    implementation 'com.google.firebase:firebase-appcheck'
    debugImplementation 'com.google.firebase:firebase-appcheck-debug'
    releaseImplementation 'com.google.firebase:firebase-appcheck-playintegrity'
    implementation 'com.google.firebase:firebase-config'

    // WebRTC Android (Maintained binary on Maven Central)
    implementation 'io.getstream:stream-webrtc-android:1.2.2'

    testImplementation 'junit:junit:4.13.2'
    // InstantTaskExecutorRule: lets LiveData.postValue run synchronously in unit tests.
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    // Real org.json for the NovaModerator lexicon tests (android.jar stubs it).
    testImplementation 'org.json:json:20231013'
}


/*
 * Release metadata for the OTA pipeline (tools/ota/release.sh).
 *
 * Reads the values the build actually used — including the -P overrides — so the
 * generated latest.json can never disagree with the APK next to it.
 */
tasks.register('printOtaVersion') {
    doLast {
        println "versionCode=${android.defaultConfig.versionCode}"
        println "versionName=${android.defaultConfig.versionName}"
        println "applicationId=${android.defaultConfig.applicationId}"
    }
}
