plugins {
    id 'com.android.application'
}

Properties localProps = new Properties()
File localPropsFile = project.rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(localPropsFile.newDataInputStream())
}

String supabaseUrl = localProps.getProperty('SUPABASE_URL',
        localProps.getProperty('supabase.url', ''))
String supabaseAnonKey = localProps.getProperty('SUPABASE_ANON_KEY',
        localProps.getProperty('supabase.anon_key', ''))

if (supabaseUrl == null) supabaseUrl = ''
if (supabaseAnonKey == null) supabaseAnonKey = ''
supabaseUrl = supabaseUrl.trim()
if (!supabaseUrl.isEmpty() && !supabaseUrl.endsWith('/')) {
    supabaseUrl = supabaseUrl + '/'
}

android {
    namespace 'com.insta.clone'
    compileSdk 34

    defaultConfig {
        applicationId "com.insta.clone"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${supabaseAnonKey}\""
        buildConfigField "String", "BASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "API_BASE_URL", "\"${supabaseUrl}\""
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'

    // Auth wizard: PickVisualMedia / TakePicture contracts + lifecycle
    implementation 'androidx.activity:activity:1.8.2'
    // 'Remember login info' off => tokens held in memory only; on => EncryptedSharedPreferences
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // Avatar / profile-picture cropping (1:1), resolved from jitpack.io
    implementation 'com.github.yalantis:ucrop:2.2.8'

    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
}

